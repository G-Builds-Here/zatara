[package]
name = "zatara"
version = "0.1.5"
edition = "2021"
description = "Zed extension for .NET gutter test run/debug via a netcoredbg DAP proxy"
license = "MIT"
publish = false
[workspace]
resolver = "2"
members = ["zatara-types", "proxy"]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
zed_extension_api = "0.7.0"
zatara-types = { path = "zatara-types" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
sha2 = "0.10"
serde_json = "1"
zed_extension_api = "0.7.0"
zatara-types = { path = "zatara-types" }
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
streaming-iterator = "0.1"
