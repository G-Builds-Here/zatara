name: Release
on:
  push:
    tags:
      - "v*"
env:
  CARGO_TERM_COLOR: always
  NETCOREDBG_REPO: Samsung/netcoredbg
  NETCOREDBG_VERSION: "3.2.0-1092"
permissions:
  contents: read
jobs:
  build-proxy:
    name: Build proxy (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
            binary: zatara-proxy.exe
            netcoredbg_pattern: "netcoredbg-win64.zip"
          - target: linux-x64
            runner: ubuntu-latest
            binary: zatara-proxy
            netcoredbg_pattern: "netcoredbg-linux-amd64.tar.gz"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: zatara-proxy
            netcoredbg_pattern: "netcoredbg-linux-arm64.tar.gz"
          - target: macos-x64
            runner: macos-15-intel
            binary: zatara-proxy
            netcoredbg_pattern: ""
          - target: macos-arm64
            runner: macos-15
            binary: zatara-proxy
            netcoredbg_pattern: "netcoredbg-osx-arm64.zip"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build zatara-proxy (release)
        run: cargo build -p zatara-proxy --release
      - name: Fetch pinned netcoredbg asset
        if: matrix.netcoredbg_pattern != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          netcoredbg_pattern: ${{ matrix.netcoredbg_pattern }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist ndbg-raw
          gh release download "$NETCOREDBG_VERSION" \
            --repo "$NETCOREDBG_REPO" \
            --pattern "$netcoredbg_pattern" \
            --dir ndbg-raw
          raw=$(ls -1 ndbg-raw)
          ext="${raw##*.}"
          cp "ndbg-raw/$raw" "dist/netcoredbg-${NETCOREDBG_VERSION}-${TARGET}.${ext}"
          echo "staged netcoredbg asset: dist/netcoredbg-${NETCOREDBG_VERSION}-${TARGET}.${ext}"
      - name: Stage proxy asset
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/zatara-proxy-${version}-${{ matrix.target }}${ext}"
          echo "staged proxy asset: dist/zatara-proxy-${version}-${{ matrix.target }}${ext}"
        env:
          ext: ${{ matrix.target == 'win-x64' && '.exe' || '' }}
      - name: Stage run-case helper asset (win-x64)
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "target/release/zatara-run-case.exe" "dist/zatara-run-case-${version}-win-x64.exe"
          echo "staged helper asset: dist/zatara-run-case-${version}-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish GitHub Release + manifest
    needs: build-proxy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect all platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist-all
          merge-multiple: true
      - name: Build version-pinned SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "release version: $version (tag ${GITHUB_REF_NAME})"
          python scripts/build_release_manifest.py --assets-dir dist-all --version "$version"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-all/*
          fail_on_unmatched_files: true
          generate_release_notes: true
  verify-download:
    name: Download-and-verify published assets
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the just-published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "*" --dir downloaded
      - name: Verify served assets against manifest.json (clean)
        run: python scripts/verify_release_assets.py --manifest downloaded/manifest.json --assets-dir downloaded
      - name: Guard proves it trips on a corrupt asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf corrupt && cp -r downloaded corrupt
          victim=$(ls -1 corrupt | grep -m1 '^zatara-proxy-')
          printf 'CORRUPTED' >> "corrupt/$victim"
          echo "corrupting asset: $victim"
          if python scripts/verify_release_assets.py --manifest corrupt/manifest.json --assets-dir corrupt | tee corrupt-out.log; then
            echo "GUARD DEFECT: verify passed a deliberately corrupt asset"
            exit 1
          fi
          grep -qi "checksum mismatch" corrupt-out.log
          grep -q "$victim" corrupt-out.log
          echo "guard correctly rejected the corrupt asset and named it"
