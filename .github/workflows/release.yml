name: Release

# Tagged releases publish per-platform proxy binaries + a version-pinned SHA256
# manifest, and prove the real download-and-verify path (LOC-0108 AC1/AC2/AC3).
#
# This workflow runs on a tag push ONLY. ci.yml carries no publish step on
# purpose, so a push to a story/feature branch publishes nothing (AC1).
#
# Supply-chain posture (DR-4/DR-6): every asset is built ON its native runner --
# GitHub-hosted runners are the only real POSIX proof -- and every published
# byte is hashed into manifest.json, then re-downloaded and re-hashed by the
# verify job before anyone consumes it.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # netcoredbg pin -- OFFICIAL Samsung/netcoredbg, NOT the qwadrox fork.
  # The qwadrox lineage is the Zed-*extension* prototype this repo descends
  # from (research findings §6/§9), never a runtime dependency; research §7
  # ("netcoredbg Linux = official") settles the adapter source. Pin decision
  # recorded in DR-4.
  # E1 verify task DONE (2026-10-13, before the first rc tag): the assumed tag
  # `3.2.0` is not a real release -- the latest is `3.2.0-1092`. Real assets of
  # that release: netcoredbg-linux-amd64.tar.gz, netcoredbg-linux-arm64.tar.gz,
  # netcoredbg-osx-arm64.zip, netcoredbg-win64.zip. D28 (2026-10-14): the
  # osx-arm64 asset is served through this manifest like the others -- the
  # extension resolves and names it on Apple Silicon. There is NO macOS x64
  # build upstream at all (verified 2026-10-14; and there is no Homebrew
  # formula either -- formulae.brew.sh 404s both the formula and the cask),
  # so the extension names no path on Intel Macs and the proxy probes
  # PATH/Homebrew prefixes there (README, Requirements).
  NETCOREDBG_REPO: Samsung/netcoredbg
  NETCOREDBG_VERSION: "3.2.0-1092"

permissions:
  contents: read

jobs:
  # AC1: one build leg per target, each on its NATIVE runner. fail-fast is ON
  # so a single failing platform aborts the matrix; publish `needs` this job,
  # so an aborted leg means no Release is ever created. The leg's job name (and
  # therefore the failing log) names the target -- "the log names the failed
  # target" (AC1 scenario).
  build-proxy:
    name: Build proxy (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
            binary: zatara-proxy.exe
            netcoredbg_pattern: "netcoredbg-win64.zip"
          - target: linux-x64
            runner: ubuntu-latest
            binary: zatara-proxy
            netcoredbg_pattern: "netcoredbg-linux-amd64.tar.gz"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: zatara-proxy
            netcoredbg_pattern: "netcoredbg-linux-arm64.tar.gz"
          # D28: the arm64 leg stages upstream's official osx-arm64 build,
          # staged+hashed by the same manifest machinery as win/linux. The
          # x64 leg stages NOTHING: upstream publishes no macOS Intel build
          # at all, so the extension names no path there and the proxy
          # probes PATH/Homebrew prefixes (README, Requirements). An empty
          # pattern skips the fetch step below.
          - target: macos-x64
            runner: macos-15-intel
            binary: zatara-proxy
            netcoredbg_pattern: ""
          - target: macos-arm64
            runner: macos-15
            binary: zatara-proxy
            netcoredbg_pattern: "netcoredbg-osx-arm64.zip"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Native host build -- no --target flag. Each runner compiles for its own
      # arch, which is exactly what "built on its native platform runner" means.
      - name: Build zatara-proxy (release)
        run: cargo build -p zatara-proxy --release

      # ONE env mapping: a step that declares 'env:' twice is a YAML
      # duplicate-key -- GitHub's parser rejects it, so every build leg would
      # die here and AC1's release would never be created.
      - name: Fetch pinned netcoredbg asset
        if: matrix.netcoredbg_pattern != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          netcoredbg_pattern: ${{ matrix.netcoredbg_pattern }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist ndbg-raw
          gh release download "$NETCOREDBG_VERSION" \
            --repo "$NETCOREDBG_REPO" \
            --pattern "$netcoredbg_pattern" \
            --dir ndbg-raw
          raw=$(ls -1 ndbg-raw)
          ext="${raw##*.}"
          cp "ndbg-raw/$raw" "dist/netcoredbg-${NETCOREDBG_VERSION}-${TARGET}.${ext}"
          echo "staged netcoredbg asset: dist/netcoredbg-${NETCOREDBG_VERSION}-${TARGET}.${ext}"

      - name: Stage proxy asset
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/zatara-proxy-${version}-${{ matrix.target }}${ext}"
          echo "staged proxy asset: dist/zatara-proxy-${version}-${{ matrix.target }}${ext}"
        env:
          ext: ${{ matrix.target == 'win-x64' && '.exe' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # AC2: collect every leg's staged assets and hash them into one
  # version-pinned manifest.json, then publish the GitHub Release carrying all
  # five proxy binaries, the pinned netcoredbg assets for win/linux (macOS
  # stages none -- see the matrix comment), and the manifest.
  # needs: build-proxy -> a failed leg skips this job entirely (AC1 scenario).
  publish:
    name: Publish GitHub Release + manifest
    needs: build-proxy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect all platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist-all
          merge-multiple: true

      - name: Build version-pinned SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "release version: $version (tag ${GITHUB_REF_NAME})"
          python scripts/build_release_manifest.py --assets-dir dist-all --version "$version"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-all/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # AC3: the real download-and-verify path. Download the freshly published
  # assets + manifest from the release and check every served byte against the
  # recorded hash; then prove the guard actually trips on a corrupt asset.
  verify-download:
    name: Download-and-verify published assets
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the just-published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "*" --dir downloaded

      - name: Verify served assets against manifest.json (clean)
        run: python scripts/verify_release_assets.py --manifest downloaded/manifest.json --assets-dir downloaded

      - name: Guard proves it trips on a corrupt asset
        shell: bash
        run: |
          # -e so the two assertions below hard-gate the job; `if` conditions
          # are exempt from -e, so the intentional non-zero from the verifier
          # is caught by `if` and does NOT abort the step early.
          set -euo pipefail
          rm -rf corrupt && cp -r downloaded corrupt
          # Deliberately corrupt one published proxy asset in place.
          victim=$(ls -1 corrupt | grep -m1 '^zatara-proxy-')
          printf 'CORRUPTED' >> "corrupt/$victim"
          echo "corrupting asset: $victim"
          if python scripts/verify_release_assets.py --manifest corrupt/manifest.json --assets-dir corrupt | tee corrupt-out.log; then
            echo "GUARD DEFECT: verify passed a deliberately corrupt asset"
            exit 1
          fi
          grep -qi "checksum mismatch" corrupt-out.log
          grep -q "$victim" corrupt-out.log
          echo "guard correctly rejected the corrupt asset and named it"
