[package]
name = "zatara-types"
version = "0.1.0"
edition = "2021"
description = "Shared cross-process contract types: launch config (camelCase) and DAP relay message structs"
license = "MIT"
publish = false

# The types crate is the single definition both consumers import (blueprint DR:
# extension -> types <- proxy); it must stay dependency-light and import nothing
# from either consumer. serde/serde_json carry the wire contract only.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
