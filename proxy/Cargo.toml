[package]
name = "zatara-proxy"
version = "0.1.0"
edition = "2021"
description = "stdio DAP proxy: answers Zed on stdin/stdout and relays to a netcoredbg child (DR-1 spike)"
license = "MIT"
publish = false
[dependencies]
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
portable-pty = "0.9"
serde_json = "1"
zatara-types = { path = "../zatara-types" }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[features]
test-fake-adapter = []
[[bin]]
name = "zatara-proxy"
path = "src/main.rs"
[[bin]]
name = "zatara-run-case"
path = "src/bin/run_case.rs"
[[bin]]
name = "zatara-fake-adapter"
path = "src/bin/fake_adapter.rs"
required-features = ["test-fake-adapter"]
[[bin]]
name = "zatara-fake-dotnet"
path = "src/bin/fake_dotnet.rs"
required-features = ["test-fake-adapter"]
